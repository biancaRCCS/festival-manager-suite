        sponsorPriceSilver:
          type: number
        sponsorPriceGold:
          type: number
        sponsorPricePlatinum:
          type: number
        sponsorPriceDiamond:
          type: number
        sponsorPriceMaxBronze:
          type: number
        sponsorPriceMaxSilver:
