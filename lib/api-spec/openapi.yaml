openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Romanian Festival Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: public
    description: Public endpoints (no auth)
  - name: portal
    description: Private vendor/sponsor portal (token-based)
  - name: dashboard
    description: Admin dashboard and stats
  - name: festival-years
    description: Festival year management
  - name: settings
    description: Festival configuration
  - name: vendors
    description: Vendor management
  - name: sponsors
    description: Sponsor management
  - name: volunteers
    description: Volunteer management
  - name: staff
    description: Staff management
  - name: export
    description: Data export
  - name: contributions
    description: Public contributions and staff reporting
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── PUBLIC ──────────────────────────────────────────────
  /public/current-year:
    get:
      operationId: getCurrentYear
      tags: [public]
      summary: Get the active festival year info
      responses:
        "200":
          description: Current year info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FestivalYear"

  /public/apply/vendor:
    post:
      operationId: submitVendorApplication
      tags: [public]
      summary: Submit a public vendor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfirmation"

  /public/apply/sponsor:
    post:
      operationId: submitSponsorApplication
      tags: [public]
      summary: Submit a public sponsor application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfirmation"

  /public/apply/volunteer:
    post:
      operationId: submitVolunteerApplication
      tags: [public]
      summary: Submit a public volunteer application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VolunteerApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationConfirmation"

  /public/contributions/checkout:
    post:
      operationId: createContributionCheckout
      tags: [contributions]
      summary: Create a Stripe Checkout session for a public contribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionCheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid contribution details
        "404":
          description: No active festival year

  # ─── PORTAL (token-based, no login) ──────────────────────
  /portal/{token}:
    get:
      operationId: getPortalInfo
      tags: [portal]
      summary: Get vendor/sponsor portal info by token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portal info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalInfo"
        "404":
          description: Not found

  /portal/{token}/submit-details:
    post:
      operationId: submitSponsorDetails
      tags: [portal]
      summary: Submit stage-2 sponsorship details (moves sponsor to details_submitted)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorStage2Data"
      responses:
        "200":
          description: Updated portal info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalInfo"
        "404":
          description: Not found
        "409":
          description: Sponsor not in approved status

  /portal/{token}/checkout:
    post:
      operationId: createPortalCheckout
      tags: [portal]
      summary: Create a Stripe checkout session for the portal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "404":
          description: Not found

  /portal/{token}/sign-agreement:
    post:
      operationId: signPortalAgreement
      tags: [portal]
      summary: Mark agreement as signed in the portal
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgreementSignature"
      responses:
        "200":
          description: Agreement signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalInfo"

  /portal/{token}/special-agreement:
    post:
      operationId: submitSpecialAgreement
      tags: [portal]
      summary: Submit a signed Special Agreement Vendor agreement
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialAgreementSignature"
      responses:
        "200":
          description: Submitted agreement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalInfo"

  # ─── DASHBOARD ───────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get current year dashboard summary
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/financials:
    get:
      operationId: getDashboardFinancials
      tags: [dashboard]
      summary: Get financial breakdown for current year
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Financials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"

  /contributions:
    get:
      operationId: listContributions
      tags: [contributions]
      summary: List completed contributions for a festival year
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Completed contributions and total received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionListResponse"
    post:
      operationId: createManualContribution
      tags: [contributions]
      summary: Record a staff-created manual contribution
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualContributionInput"
      responses:
        "201":
          description: Recorded contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "400": { description: Invalid manual payment }
  /contributions/{id}/manual-payment:
    delete:
      operationId: removeManualContribution
      tags: [contributions]
      summary: Void a staff-created manual contribution
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Voided contribution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contribution"
        "404": { description: Not found }
        "409": { description: Contribution is not an active manual contribution }

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get paginated activity feed with optional filters
      security:
        - clerkAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
            minimum: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - in: query
          name: type
          schema:
            type: string
            enum: [new_application, approved, rejected, paid, final_approved, assigned, category_changed, category_adjustment_settled, details_updated, special_agreement_created, special_agreement_signed, special_agreement_settlement_updated, manual_payment_recorded, manual_payment_removed, deleted]
        - in: query
          name: entityType
          schema:
            type: string
            enum: [vendor, sponsor, volunteer, contribution]
      responses:
        "200":
          description: Paginated activity feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivityResponse"

  # ─── FESTIVAL YEARS ──────────────────────────────────────
  /festival-years:
    get:
      operationId: listFestivalYears
      tags: [festival-years]
      summary: List all festival years
      security:
        - clerkAuth: []
      responses:
        "200":
          description: Festival years
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FestivalYear"

    post:
      operationId: createFestivalYear
      tags: [festival-years]
      summary: Create a new festival year
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FestivalYearInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FestivalYear"

  /festival-years/{id}:
    patch:
      operationId: updateFestivalYear
      tags: [festival-years]
      summary: Update a festival year
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FestivalYearUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FestivalYear"

  # ─── SETTINGS ────────────────────────────────────────────
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      summary: Get settings for a year (defaults to current)
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FestivalSettings"

    patch:
      operationId: updateSettings
      tags: [settings]
      summary: Update settings
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FestivalSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FestivalSettings"

  # ─── VENDORS ─────────────────────────────────────────────
  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors (optionally filtered by year)
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Vendors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"

  /special-agreements:
    get:
      operationId: listSpecialAgreementVendors
      tags: [vendors]
      summary: List staff-created Special Agreement Vendors
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Special Agreement Vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Vendor"
    post:
      operationId: createSpecialAgreementVendor
      tags: [vendors]
      summary: Create a Special Agreement Vendor and email their agreement link
      security:
        - clerkAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialAgreementVendorInput"
      responses:
        "201":
          description: Created Special Agreement Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /special-agreements/settlement-summary:
    get:
      operationId: getSpecialAgreementSettlementSummary
      tags: [vendors]
      summary: Get Special Agreement Vendor settlement summary
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Special Agreement Vendor settlement summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpecialAgreementSettlementSummary"

  /vendors/{id}:
    get:
      operationId: getVendor
      tags: [vendors]
      summary: Get a vendor by ID
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found

    delete:
      operationId: deleteVendor
      tags: [vendors]
      summary: Delete a vendor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /vendors/{id}/special-agreement-settlement:
    patch:
      operationId: updateSpecialAgreementSettlement
      tags: [vendors]
      summary: Update a Special Agreement Vendor settlement
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpecialAgreementSettlementUpdate"
      responses:
        "200":
          description: Updated Special Agreement Vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid settlement details
        "409":
          description: Settlement was updated by another staff member
        "404":
          description: Not found

  /vendors/{id}/review:
    patch:
      operationId: reviewVendor
      tags: [vendors]
      summary: Approve or reject a vendor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
  /vendors/{id}/manual-payment:
    post:
      operationId: recordVendorManualPayment
      tags: [vendors]
      summary: Record an offline vendor payment
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualPaymentInput"
      responses:
        "200":
          description: Paid vendor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }
        "409": { description: Confirmation or removal of existing manual payment required }
    delete:
      operationId: removeVendorManualPayment
      tags: [vendors]
      summary: Remove an offline vendor payment
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Vendor" }

  /vendors/{id}/category:
    patch:
      operationId: updateVendorCategory
      tags: [vendors]
      summary: Correct a vendor category and calculate any payment adjustment
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorCategoryUpdate"
      responses:
        "200":
          description: Updated vendor category and payment adjustment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VendorCategoryUpdateResult"
        "400":
          description: Invalid update
        "404":
          description: Not found

  /vendors/{id}/details:
    patch:
      operationId: updateVendorDetails
      tags: [vendors]
      summary: Correct staff-editable vendor contact and business details without sending email
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendorDetailsUpdate"
      responses:
        "200":
          description: Updated vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "400":
          description: Invalid details
        "404":
          description: Not found

  /vendors/{id}/reconcile-status-from-timestamps:
    patch:
      operationId: reconcileVendorStatusFromTimestamps
      tags: [vendors]
      summary: Restore a vendor status from existing workflow timestamps without sending email
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reconciled vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
        "409":
          description: No restorable later-stage timestamp or concurrent update

  /vendors/{id}/settle-category-adjustment:
    patch:
      operationId: settleVendorCategoryAdjustment
      tags: [vendors]
      summary: Mark a paid vendor's manual category adjustment as handled
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vendor with the manual adjustment cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"
        "404":
          description: Not found
        "409":
          description: No manual adjustment is awaiting settlement

  /vendors/{id}/final-approve:
    patch:
      operationId: finalApproveVendor
      tags: [vendors]
      summary: Final approve a vendor after payment
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Final approved vendor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}/assign:
    patch:
      operationId: assignVendorSpot
      tags: [vendors]
      summary: Assign spot number and location to a vendor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpotAssignment"
      responses:
        "200":
          description: Vendor with assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Vendor"

  /vendors/{id}/resend-confirmation:
    post:
      operationId: resendVendorConfirmation
      tags: [vendors]
      summary: Resend applicant confirmation email to a vendor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Email queued
        "404":
          description: Not found

  # ─── SPONSORS ────────────────────────────────────────────
  /sponsors:
    get:
      operationId: listSponsors
      tags: [sponsors]
      summary: List sponsors (optionally filtered by year)
      security:
        - clerkAuth: []
      parameters:
        - name: yearId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Sponsors list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sponsor"

  /sponsors/{id}:
    get:
      operationId: getSponsor
      tags: [sponsors]
      summary: Get a sponsor by ID
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
        "404":
          description: Not found
    delete:
      operationId: deleteSponsor
      tags: [sponsors]
      summary: Delete a sponsor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sponsors/{id}/review:
    patch:
      operationId: reviewSponsor
      tags: [sponsors]
      summary: Approve or reject a sponsor
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewDecision"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
  /sponsors/{id}/manual-payment:
    post:
      operationId: recordSponsorManualPayment
      tags: [sponsors]
      summary: Record an offline sponsor payment
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPaymentInput" }
      responses:
        "200":
          description: Paid sponsor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsor" }
        "409": { description: Confirmation or removal of existing manual payment required }
    delete:
      operationId: removeSponsorManualPayment
      tags: [sponsors]
      summary: Remove an offline sponsor payment
      security:
        - clerkAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sponsor" }

  /sponsors/{id}/details:
    patch:
      operationId: updateSponsorDetails
      tags: [sponsors]
      summary: Correct staff-editable sponsor contact and business details without sending email
      security:
        - clerkAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SponsorDetailsUpdate"
      responses:
        "200":
          description: Updated sponsor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sponsor"
        "400":
          description: Invalid details
        "404":
          description: Not found

  /sponsors/{id}/reconcile-status-from-timestamps:
    patch:
      operationId: reconcileSponsorStatusFromTimestamps
      tags: [sponsors]
