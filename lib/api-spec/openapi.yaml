components:
  securitySchemes:
    clerkAuth:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    FestivalYear:
      type: object
      required: [id, year, eventName, eventDate, isActive, createdAt]
      properties:
        id:
          type: integer
        year:
          type: integer
        eventName:
          type: string
        eventDate:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string

    FestivalYearInput:
      type: object
      required: [year, eventName, eventDate]
      properties:
        year:
          type: integer
        eventName:
          type: string
        eventDate:
          type: string
        isActive:
          type: boolean

    FestivalYearUpdate:
      type: object
      properties:
        eventName:
          type: string
        eventDate:
          type: string
        isActive:
          type: boolean

    FestivalSettings:
      type: object
      required: [id, yearId, vendorTypeLabelMajorFood, vendorTypeLabelSpecialtyFood, vendorTypeLabelRetail, vendorTypeLabelNonprofit, vendorPriceMajorFood, vendorPriceSpecialtyFood, vendorPriceRetail, vendorPriceNonprofit, vendorSpotLimitMajorFood, vendorSpotLimitSpecialtyFood, vendorSpotLimitRetail, vendorSpotLimitNonprofit, sponsorPriceBronze, sponsorPriceSilver, sponsorPriceGold, sponsorPricePlatinum, sponsorPriceDiamond, sponsorPriceMaxBronze, sponsorPriceMaxSilver, sponsorPriceMaxGold, sponsorPriceMaxPlatinum, sponsorSpotLimitBronze, sponsorSpotLimitSilver, sponsorSpotLimitGold, sponsorSpotLimitPlatinum, sponsorSpotLimitDiamond, vendorFormQuestions, sponsorFormQuestions, volunteerFormQuestions]
      properties:
        id:
          type: integer
        yearId:
          type: integer
        # Vendor categories (4)
        vendorTypeLabelMajorFood:
          type: string
        vendorTypeLabelSpecialtyFood:
          type: string
        vendorTypeLabelRetail:
          type: string
        vendorTypeLabelNonprofit:
          type: string
        vendorPriceMajorFood:
          type: number
        vendorPriceSpecialtyFood:
          type: number
        vendorPriceRetail:
          type: number
        vendorPriceNonprofit:
          type: number
        vendorSpotLimitMajorFood:
          type: integer
        vendorSpotLimitSpecialtyFood:
          type: integer
        vendorSpotLimitRetail:
          type: integer
        vendorSpotLimitNonprofit:
          type: integer
        # Sponsor tiers — min and max prices
        sponsorPriceBronze:
          type: number
        sponsorPriceSilver:
          type: number
        sponsorPriceGold:
          type: number
        sponsorPricePlatinum:
          type: number
        sponsorPriceDiamond:
          type: number
        sponsorPriceMaxBronze:
          type: number
        sponsorPriceMaxSilver:
          type: number
        sponsorPriceMaxGold:
          type: number
        sponsorPriceMaxPlatinum:
          type: number
        sponsorPriceMaxDiamond:
          type: ["number", "null"]
        sponsorSpotLimitBronze:
          type: integer
        sponsorSpotLimitSilver:
          type: integer
        sponsorSpotLimitGold:
          type: integer
        sponsorSpotLimitPlatinum:
          type: integer
        sponsorSpotLimitDiamond:
          type: integer
        # Dates & operational settings
        festivalDate:
          type: ["string", "null"]
        applicationDeadline:
          type: ["string", "null"]
        documentDeadline:
          type: ["string", "null"]
        paymentWindowDays:
          type: integer
        notificationEmail:
          type: ["string", "null"]
        styleGuidelinesUrl:
          type: ["string", "null"]
        specialAgreementNetProfitDefinition:
          type: string
        # Form customisation
        vendorFormQuestions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"
        sponsorFormQuestions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"
        volunteerFormQuestions:
          type: array
          items:
            $ref: "#/components/schemas/FormQuestion"
        sponsorFormDescription:
          type: ["string", "null"]
        sponsorFormHeaderImage:
          type: ["string", "null"]
        vendorFormDescription:
          type: ["string", "null"]
        vendorFormHeaderImage:
          type: ["string", "null"]

    FestivalSettingsUpdate:
