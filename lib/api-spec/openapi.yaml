          type: ["string", "null"]
        applicationDeadline:
          type: ["string", "null"]
        documentDeadline:
          type: ["string", "null"]
        paymentWindowDays:
          type: integer
        notificationEmail:
          type: ["string", "null"]
        styleGuidelinesUrl:
